<!DOCTYPE html>
<html>
<head>
  <title>Chat</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 0; height: 100vh; }
    #app { display: flex; height: 100vh; }

    #sidebar { width: 280px; border-right: 1px solid #ccc; padding: 10px;
               display: flex; flex-direction: column; overflow-y: auto; }
    #meBar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    #search { padding: 8px; width: 100%; }
    #sidebar ul { list-style: none; padding: 0; margin: 5px 0; }
    #sidebar li { padding: 10px; cursor: pointer; border-radius: 6px;
                  display: flex; justify-content: space-between; align-items: center; }
    #sidebar li:hover { background: #eee; }
    #sidebar li.active { background: #dbeafe; }
    #results li { background: #fffbe6; }
    .badge { background: #e11d48; color: white; border-radius: 10px;
             padding: 0 7px; font-size: 12px; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
           background: #bbb; margin-right: 8px; }
    .dot.online { background: #22c55e; }
    h4 { margin: 15px 0 5px; color: #666; }

    #main { flex: 1; display: flex; flex-direction: column; padding: 10px; min-width: 0; }
    #chatHeader { padding: 10px; border-bottom: 1px solid #ccc; }
    #titleName { font-weight: bold; }
    #titleStatus { font-size: 12px; color: #888; margin-left: 8px; }
    #titleStatus.online { color: #16a34a; }
    #messages { flex: 1; list-style: none; padding: 10px; margin: 0; overflow-y: auto; }
    #messages li { margin-bottom: 8px; padding: 8px 12px; border-radius: 10px;
                   max-width: 70%; background: #f1f1f1; width: fit-content; }
    #messages li.mine { background: #dcf8c6; margin-left: auto; }
    #messages li.deleted { background: #fafafa; color: #999; font-style: italic;
                           border: 1px dashed #ddd; }
    .sender { font-size: 12px; color: #666; }
    .body { word-wrap: break-word; }
    .meta { font-size: 11px; color: #888; margin-top: 3px; display: flex; gap: 8px;
            justify-content: flex-end; }
    .actions { display: none; gap: 6px; }
    .actions a { color: #2563eb; cursor: pointer; }
    #messages li:hover .actions { display: flex; }

    #typing { height: 20px; font-size: 13px; color: #666; font-style: italic; padding-left: 10px; }
    #inputBar { display: flex; gap: 6px; }
    #msg { flex: 1; padding: 10px; }
    #send { padding: 10px 16px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <div id="meBar">
        <span id="who"></span>
        <button id="logout">Logout</button>
      </div>

      <input id="search" placeholder="Search users..." autocomplete="off" />
      <ul id="results"></ul>

      <h4>Chats</h4>
      <ul id="convList"></ul>
    </div>

    <div id="main">
      <div id="chatHeader">
        <span id="titleName">Select a chat or search for a user</span>
        <span id="titleStatus"></span>
      </div>
      <ul id="messages"></ul>
      <div id="typing"></div>
      <div id="inputBar">
        <input id="msg" placeholder="Type a message..." autocomplete="off" disabled />
        <button id="send" disabled>Send</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const messagesEl = document.getElementById('messages');
    const msgInput = document.getElementById('msg');
    const sendBtn = document.getElementById('send');
    const titleName = document.getElementById('titleName');
    const titleStatus = document.getElementById('titleStatus');
    const typingEl = document.getElementById('typing');
    const convListEl = document.getElementById('convList');
    const resultsEl = document.getElementById('results');
    const searchInput = document.getElementById('search');

    let myName = null;
    let currentConvId = null;
    const conversations = new Map();  // id -> { id, other_id, other_username, unread }
    const onlineUsers = new Set();    // ids of users who are online right now

    // ---------- Time (stored as UTC in the database, shown in IST) ----------
    function formatTime(sqlDate) {
      const d = new Date(sqlDate.replace(' ', 'T') + 'Z'); // mark it as UTC
      const tz = { timeZone: 'Asia/Kolkata' };
      const time = d.toLocaleTimeString('en-IN', { ...tz, hour: '2-digit', minute: '2-digit', hour12: true });
      const dayFmt = { ...tz, day: '2-digit', month: 'short' };
      const day = d.toLocaleDateString('en-IN', dayFmt);
      const today = new Date().toLocaleDateString('en-IN', dayFmt);
      return day === today ? time : `${day}, ${time}`;
    }

    // ---------- Connection ----------
    socket.on('connect_error', () => { window.location.href = '/login.html'; });

    socket.on('me', (data) => {
      myName = data.username;
      document.getElementById('who').textContent = myName;
    });

    document.getElementById('logout').onclick = async () => {
      await fetch('/logout', { method: 'POST' });
      window.location.href = '/login.html';
    };

    // ---------- Online status ----------
    socket.on('online users', (ids) => {
      onlineUsers.clear();
      ids.forEach((id) => onlineUsers.add(id));
      renderConvList();
      updateHeader();
    });

    socket.on('presence', ({ userId, online }) => {
      if (online) onlineUsers.add(userId);
      else onlineUsers.delete(userId);
      renderConvList();
      updateHeader();
    });

    function updateHeader() {
      const c = conversations.get(currentConvId);
      if (!c) return;
      const online = onlineUsers.has(c.other_id);
      titleName.textContent = c.other_username;
      titleStatus.textContent = online ? 'online' : 'offline';
      titleStatus.className = online ? 'online' : '';
    }

    // ---------- Sidebar: conversation list ----------
    async function loadConversations() {
      const res = await fetch('/api/conversations');
      if (res.status === 401) return (window.location.href = '/login.html');
      const rows = await res.json();
      rows.forEach((c) => conversations.set(c.id, { ...c, unread: 0 }));
      renderConvList();
    }

    function renderConvList() {
      convListEl.innerHTML = '';
      for (const c of conversations.values()) {
        const li = document.createElement('li');
        if (c.id === currentConvId) li.classList.add('active');

        const left = document.createElement('span');
        const dot = document.createElement('span');
        dot.className = 'dot' + (onlineUsers.has(c.other_id) ? ' online' : '');
        const name = document.createElement('span');
        name.textContent = c.other_username;
        left.appendChild(dot);
        left.appendChild(name);
        li.appendChild(left);

        if (c.unread > 0) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = c.unread;
          li.appendChild(badge);
        }

        li.onclick = () => openConversation(c.id);
        convListEl.appendChild(li);
      }
    }

    socket.on('new conversation', (c) => {
      conversations.set(c.id, { ...c, unread: 0 });
      renderConvList();
    });

    // ---------- Open a conversation ----------
    async function openConversation(id) {
      currentConvId = id;
      const c = conversations.get(id);
      c.unread = 0;
      messagesEl.innerHTML = '';
      typingEl.textContent = '';
      updateHeader();
      renderConvList();

      const res = await fetch(`/api/conversations/${id}/messages`);
      const rows = await res.json();
      if (currentConvId !== id) return;

      rows.forEach(addMessage);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      msgInput.disabled = false;
      sendBtn.disabled = false;
      msgInput.focus();
    }

    // ---------- Drawing a message ----------
    function buildMessage(m) {
      const li = document.createElement('li');
      li.dataset.id = m.id;
      const mine = m.username === myName;
      if (mine) li.classList.add('mine');

      if (m.deleted) {
        li.classList.add('deleted');
        li.textContent = 'This message was deleted';
        return li;
      }

      const sender = document.createElement('div');
      sender.className = 'sender';
      sender.textContent = m.username;

      const body = document.createElement('div');
      body.className = 'body';
      body.textContent = m.text;

      const meta = document.createElement('div');
      meta.className = 'meta';

      if (mine) {
        const actions = document.createElement('span');
        actions.className = 'actions';

        const edit = document.createElement('a');
        edit.textContent = 'Edit';
        edit.onclick = () => {
          const newText = prompt('Edit message:', m.text);
          if (newText && newText.trim() && newText.trim() !== m.text) {
            socket.emit('edit message', { id: m.id, text: newText });
          }
        };

        const del = document.createElement('a');
        del.textContent = 'Delete';
        del.onclick = () => {
          if (confirm('Delete this message?')) socket.emit('delete message', { id: m.id });
        };

        actions.appendChild(edit);
        actions.appendChild(del);
        meta.appendChild(actions);
      }

      const time = document.createElement('span');
      time.textContent = (m.edited_at ? 'edited · ' : '') + formatTime(m.created_at);
      meta.appendChild(time);

      li.appendChild(sender);
      li.appendChild(body);
      li.appendChild(meta);
      return li;
    }

    function addMessage(m) {
      messagesEl.appendChild(buildMessage(m));
    }

    // An existing message was edited or deleted -> redraw just that one
    socket.on('message updated', (m) => {
      if (m.conversation_id !== currentConvId) return;
      const old = messagesEl.querySelector(`[data-id="${m.id}"]`);
      if (old) old.replaceWith(buildMessage(m));
    });

    // ---------- Sending / receiving ----------
    function send() {
      const text = msgInput.value.trim();
      if (!text || currentConvId === null) return;
      socket.emit('chat message', { conversationId: currentConvId, text });
      msgInput.value = '';
    }

    sendBtn.onclick = send;
    msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

    socket.on('chat message', (m) => {
      if (m.conversation_id === currentConvId) {
        typingEl.textContent = '';
        addMessage(m);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      } else {
        const c = conversations.get(m.conversation_id);
        if (c) { c.unread++; renderConvList(); }
      }
    });

    // ---------- Typing indicator ----------
    let lastTypingSent = 0;
    let typingTimer;

    msgInput.addEventListener('input', () => {
      if (currentConvId === null) return;
      const now = Date.now();
      if (now - lastTypingSent > 2000) { // at most once every 2 seconds
        socket.emit('typing', { conversationId: currentConvId });
        lastTypingSent = now;
      }
    });

    socket.on('typing', ({ conversationId, username }) => {
      if (conversationId !== currentConvId) return;
      typingEl.textContent = `${username} is typing...`;
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => { typingEl.textContent = ''; }, 3000);
    });

    // ---------- Search users ----------
    let searchTimer;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(async () => {
        const q = searchInput.value.trim();
        resultsEl.innerHTML = '';
        if (!q) return;

        const res = await fetch('/api/users?q=' + encodeURIComponent(q));
        const users = await res.json();

        users.forEach((u) => {
          const li = document.createElement('li');
          li.textContent = u.username;
          li.onclick = () => startChat(u.id);
          resultsEl.appendChild(li);
        });

        if (users.length === 0) {
          const li = document.createElement('li');
          li.textContent = 'No users found';
          resultsEl.appendChild(li);
        }
      }, 250);
    });

    async function startChat(userId) {
      const res = await fetch('/api/conversations', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId })
      });
      const c = await res.json();
      if (!conversations.has(c.id)) conversations.set(c.id, { ...c, unread: 0 });

      searchInput.value = '';
      resultsEl.innerHTML = '';
      openConversation(c.id);
    }

    loadConversations();
  </script>
</body>
</html>
